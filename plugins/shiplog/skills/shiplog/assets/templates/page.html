<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{meta_description}}">
{{meta_tags}}
<link rel="alternate" type="application/atom+xml" title="{{s.title}} (Atom)" href="feed.xml">
{{feed_links}}<link rel="alternate" type="application/json" title="{{s.title}} (JSON)" href="changelog.json">
<style>
:root {
  --bg: #ffffff; --fg: #111113; --muted: #5d5f66; --faint: #686a71; --border: #e7e7ea; --surface: #f6f6f7;
  --accent: {{accent}}; --accent-fg: {{accent_fg}};
  --warn-bg: #fff6e6; --warn-fg: #7a3e00; --warn-border: #f2c27a;
  --danger-bg: #fdeeee; --danger-fg: #8a1c1c; --danger-border: #eeb0b0;
  --focus: #1d4ed8;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f11; --fg: #ececef; --muted: #a2a4ab; --faint: #85878e; --border: #25272b; --surface: #16171a;
    --warn-bg: #2e2208; --warn-fg: #ffd9a3; --warn-border: #7a5413;
    --danger-bg: #331313; --danger-fg: #ffc9c9; --danger-border: #7d2a2a;
    --focus: #93b4ff;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 1rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
a:hover { text-decoration-thickness: 2.5px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -9999px; top: 0; background: var(--fg); color: var(--bg); padding: .5rem 1rem; z-index: 10; }
.skip:focus { left: 1rem; top: 1rem; }
.wrap { max-width: 62rem; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; }

/* Header */
header.site { padding-bottom: 2rem; }
.brand { display: flex; align-items: center; gap: .6rem; margin: 0 0 1.25rem; font-weight: 600; color: var(--muted); }
.brand img { height: 1.75rem; width: auto; }
header.site h1 { font-size: clamp(2.2rem, 5vw, 3rem); line-height: 1.1; letter-spacing: -.025em; margin: 0; }
.lede { font-size: 1.15rem; color: var(--muted); margin: .75rem 0 0; max-width: 40rem; }
.subscribe { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-top: 1.5rem; font-size: .95rem; }
.btn { display: inline-flex; align-items: center; gap: .45rem; padding: .45rem .9rem; border-radius: 999px;
  background: var(--fg); color: var(--bg); text-decoration: none; font-weight: 600; }
.btn:hover { opacity: .88; }
.btn svg { width: 1em; height: 1em; }
.subscribe .plain { color: var(--muted); }
.banner { background: var(--danger-bg); color: var(--danger-fg); border: 1px solid var(--danger-border); padding: .75rem 1rem; border-radius: .6rem; margin: 0 0 1.5rem; }

/* Filter bar */
form.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .75rem 0; margin-bottom: .5rem;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: .95rem; }
form.toolbar label.field { display: inline-flex; align-items: center; gap: .5rem; color: var(--muted); }
select, input[type=search] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: .5rem; padding: .35rem .6rem; min-height: 2.4rem; }
select:hover, input[type=search]:hover { border-color: var(--muted); }
input[type=search] { min-width: 12rem; flex: 1 1 12rem; max-width: 20rem; }
.toggle { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; color: var(--muted); }
input[type=checkbox] { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
#result-count { margin: 0 0 0 auto; color: var(--faint); font-size: .9rem; }

/* Releases */
article.release { display: grid; grid-template-columns: 1fr; gap: .75rem; padding: 3rem 0; border-bottom: 1px solid var(--border); }
@media (min-width: 56rem) {
  article.release { grid-template-columns: 10.5rem minmax(0, 1fr); gap: 3rem; }
  .rail { position: sticky; top: 1.5rem; align-self: start; }
}
.rail { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .75rem; font-size: .92rem; }
@media (min-width: 56rem) { .rail { flex-direction: column; gap: .35rem; } }
.rail .date { color: var(--muted); text-decoration: none; }
.rail .date:hover { color: var(--fg); text-decoration: underline; }
.rail .version { font: 600 .8rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px; padding: .3rem .55rem; }
.release-body { max-width: 42rem; min-width: 0; }
.release-body > h2 { font-size: clamp(1.5rem, 3vw, 1.9rem); line-height: 1.2; letter-spacing: -.02em; margin: 0; }
.release-body > h2 a { text-decoration: none; }
.release-body > h2 a:hover { text-decoration: underline; }
.intro { font-size: 1.08rem; color: var(--muted); margin: .6rem 0 0; }
figure.media { margin: 1.5rem 0 0; }
figure.media img { display: block; width: 100%; height: auto; border-radius: .75rem; border: 1px solid var(--border); }

.callout { margin: 1.75rem 0 0; padding: 1rem 1.25rem; border-radius: .75rem; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); }
.callout h3 { font-size: 1rem; margin: 0 0 .5rem; }
.callout ul { margin: 0; padding: 0; list-style: none; }
.callout li { padding: .6rem 0; border-top: 1px solid var(--warn-border); }
.callout li:first-child { border-top: 0; padding-top: 0; }
.callout p { margin: .2rem 0; }
.callout .deadline { font-weight: 600; }
.callout .tag { border-color: var(--warn-border); color: var(--warn-fg); }

section.highlight { margin-top: 2.25rem; }
section.highlight h3 { font-size: 1.25rem; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 .4rem; }
section.highlight p { margin: .5rem 0; }
section.group { margin-top: 2.25rem; }
section.group h3 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 0 .5rem; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { position: relative; padding: .55rem 0 .55rem 1.1rem; }
ul.items li::before { content: ""; position: absolute; left: .1rem; top: 1.15rem; width: .35rem; height: .35rem; border-radius: 50%; background: var(--faint); }
.item-title { margin: 0; }
.item-desc p { margin: .15rem 0 0; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin: .5rem 0 0; font-weight: 600; font-size: .95rem; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: .45rem 0 0; }
.tag { font-size: .78rem; line-height: 1.4; padding: .05rem .5rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.badge { display: inline-block; vertical-align: .1em; font-size: .72rem; font-weight: 700; line-height: 1.5; padding: 0 .45rem; border-radius: 999px; border: 1px solid; white-space: nowrap; letter-spacing: .01em; }
.badge.breaking, .badge.withdrawn { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-border); }
.badge.action { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-border); }
details.internal { margin-top: .5rem; background: var(--surface); border: 1px dashed var(--muted); border-radius: .5rem; padding: .5rem .75rem; font-size: .93rem; }
details.internal summary { cursor: pointer; font-weight: 600; }

nav.archive { padding: 2.5rem 0 0; }
nav.archive h2 { font-size: 1rem; margin: 0 0 .6rem; }
nav.archive ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
nav.archive a { display: inline-block; padding: .3rem .8rem; border: 1px solid var(--border); border-radius: 999px; text-decoration: none; }
nav.archive a:hover { border-color: var(--muted); }
nav.archive a[aria-current] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
footer.site { color: var(--faint); font-size: .9rem; padding-top: 2.5rem; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media print { form.toolbar, .skip, .subscribe, nav.archive { display: none; } .rail { position: static; } }
</style>
</head>
<body>
<a class="skip" href="#main">{{s.skip_link}}</a>
<div class="wrap">
<header class="site">
  <p class="brand">{{logo}}<span>{{app_name}}</span></p>
  <h1>{{heading}}</h1>
  <p class="lede">{{intro}}</p>
  <div class="subscribe">
    <a class="btn" href="{{subscribe_href}}">{{subscribe_icon}}{{s.subscribe}}</a>
    <a class="plain" href="changelog.json">{{s.json_link}}</a>
  </div>
</header>
{{internal_banner}}
<form class="toolbar" id="filters" hidden aria-label="{{s.filter_heading}}">
  <label class="field" for="f-audience">{{s.affects}}
    <select id="f-audience" name="audience">
      <option value="">{{s.anyone}}</option>
      {{audience_options}}
    </select>
  </label>
  <label class="sr-only" for="f-search">{{s.search}}</label>
  <input type="search" id="f-search" name="q" placeholder="{{s.search}}" autocomplete="off">
  <label class="toggle"><input type="checkbox" id="f-action" name="action"> {{s.action_only}}</label>
  <p id="result-count" role="status" aria-live="polite" data-all="{{s.showing_all}}" data-some="{{s.showing_some}}"></p>
</form>
<main id="main">
{{releases}}
</main>
{{archive_nav}}
<footer class="site">
  <p>{{updated}}{{published_with}}</p>
</footer>
</div>
<script>
(function () {
  var form = document.getElementById('filters');
  if (!form || !document.querySelector) return;
  form.hidden = false;
  function all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  var entries = all('.entry');
  var actions = all('.action-item');
  var count = document.getElementById('result-count');
  function forAudience(el, aud) {
    if (!aud) return true;
    var a = (el.dataset.audiences || '').split(' ');
    return a.indexOf(aud) !== -1 || a.indexOf('everyone') !== -1;
  }
  function apply() {
    var aud = form.audience.value;
    var onlyAction = form.action.checked;
    var q = form.q.value.trim().toLowerCase();
    var shown = 0;
    entries.forEach(function (el) {
      var ok = forAudience(el, aud);
      if (ok && onlyAction) ok = el.dataset.action === 'true';
      if (ok && q) ok = el.textContent.toLowerCase().indexOf(q) !== -1;
      el.hidden = !ok; if (ok) shown++;
    });
    actions.forEach(function (el) {
      var ok = forAudience(el, aud);
      if (ok && q) ok = el.textContent.toLowerCase().indexOf(q) !== -1;
      el.hidden = !ok;
    });
    all('section.group, aside.callout').forEach(function (g) {
      g.hidden = !g.querySelector('li:not([hidden])');
    });
    all('article.release').forEach(function (r) {
      r.hidden = !r.querySelector('.entry:not([hidden])');
    });
    count.textContent = shown === entries.length
      ? count.dataset.all.replace('{n}', shown)
      : count.dataset.some.replace('{shown}', shown).replace('{total}', entries.length);
  }
  form.addEventListener('input', apply);
  form.addEventListener('change', apply);
  form.addEventListener('submit', function (e) { e.preventDefault(); });
  apply();
})();
</script>
</body>
</html>
